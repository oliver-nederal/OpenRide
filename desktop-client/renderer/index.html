<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GPS Simulator</title>
    <style>
        body { font-family: sans-serif; margin: 16px; }
        label { display: inline-block; width: 90px; }
        input[type="range"] { width: 220px; vertical-align: middle; }
        p { margin: 6px 0; }
        pre { background: #eee; padding: 6px; font-size: 11px; }
    </style>
</head>
<body>
    <h3>Mock GPS</h3>

    <p>
        <select id="port"></select>
        <button id="refresh">Refresh</button>
        <button id="connect">Connect</button>
        <span id="portStatus">Not connected</span>
    </p>

    <h4>Manual</h4>
    <p><label>Speed</label> <input type="range" id="speedKmh" min="0" max="80" step="0.5" value="18"> <span id="speedKmhVal">18</span> km/h</p>
    <p><label>Heading</label> <input type="range" id="heading" min="0" max="359" value="90"> <span id="headingVal">90</span>°</p>
    <p><label>Latitude</label> <input type="range" id="lat" min="-90" max="90" step="0.00001" value="50.08804"> <span id="latVal">50.08804</span></p>
    <p><label>Longitude</label> <input type="range" id="lon" min="-180" max="180" step="0.00001" value="14.42076"> <span id="lonVal">14.42076</span></p>
    <p><label>Satellites</label> <input type="range" id="sats" min="0" max="24" value="9"> <span id="satsVal">9</span></p>
    <p><label>Fix</label> <input type="checkbox" id="fix" checked></p>

    <h4>GPX file</h4>
    <p><input type="file" id="file" accept=".gpx"></p>
    <p>
        <button id="play">Play / Pause</button>
        <button id="restart">Restart</button>
        <button id="stop">Stop (back to manual)</button>
        <span id="gpxStatus"></span>
    </p>

    <h4>Output</h4>
    <p id="status"></p>
    <pre id="nmea"></pre>

    <script src="renderer.js"></script>
</body>
</html>
