[env:esp32-2432S022C]
platform = espressif32
board = esp32-2432S022C
framework = arduino
monitor_speed = 9600
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=1
    ; GPS UART2 — RX from the USB-TTL adapter's TX. GPIO35 is input-only
    ; and not used by the display, touch, TF or speaker on this board.
    -D GPS_RX_PIN=35
    -D GPS_TX_PIN=-1
    -D GPS_BAUD=9600
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay.git#2.1.1
    mikalhart/TinyGPSPlus@^1.0.3

